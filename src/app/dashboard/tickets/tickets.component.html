<div id="ticket">
  <ul>
    @for(ticket of tickets; track ticket.id) {
      <li>
        <app-ticket [data]="ticket" (complete)="onComplete(ticket.id)"/> <!-- - {{ $last }} -->
      </li>
    } @empty {
      <p>No Tickets Available!</p>
    }
  </ul>
</div>
  <div id="new-ticket">
    <app-new-ticket (add)="onAddTicket($event)" />
  </div>
