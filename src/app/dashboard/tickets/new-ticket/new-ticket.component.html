<form (ngSubmit)="onSubmit(titleInput.value, textInput.value)" #form>
  <app-control label="Title">
    <input type="text" name="title" id="title" #input #titleInput>
  </app-control>

  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #input #textInput></textarea>
  </app-control>

  <p>
    <button appButton #btn>
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
